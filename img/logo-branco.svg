<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 306 56" width="306" height="56" role="img" aria-label="Gustavo Modas">
  <style>
    .borda{stroke-dasharray:100;stroke-dashoffset:100;animation:desenha 1.2s .2s ease-out forwards}
    .cabide{transform-origin:28px 12px;opacity:0;animation:entra .4s .7s ease-out forwards,balanco 1.6s 1s ease-out both,balanco-loop 7s 5s ease-out infinite}
    .nome{opacity:0;animation:texto .7s .6s ease-out forwards}
    @keyframes desenha{to{stroke-dashoffset:0}}
    @keyframes entra{to{opacity:1}}
    @keyframes balanco{0%{transform:rotate(0)}15%{transform:rotate(16deg)}35%{transform:rotate(-11deg)}55%{transform:rotate(6deg)}75%{transform:rotate(-3deg)}100%{transform:rotate(0)}}
    @keyframes balanco-loop{0%{transform:rotate(0)}4%{transform:rotate(14deg)}10%{transform:rotate(-10deg)}16%{transform:rotate(5deg)}22%{transform:rotate(-2deg)}28%,100%{transform:rotate(0)}}
    @keyframes texto{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){.borda{stroke-dashoffset:0;animation:none}.cabide,.nome{opacity:1;animation:none}}
  </style>
  <rect class="borda" pathLength="100" x="2" y="2" width="52" height="52" rx="13" fill="none" stroke="#fff" stroke-width="3"/>
  <g class="cabide" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M28 23v-3.5a4.5 4.5 0 1 0-4.5-4.5"/>
    <path d="M28 23 45 34.5a2 2 0 0 1-1.1 3.7H12.1A2 2 0 0 1 11 34.5L28 23"/>
  </g>
  <text class="nome" x="70" y="37" textLength="228" lengthAdjust="spacingAndGlyphs" font-family="Segoe UI, system-ui, -apple-system, Roboto, sans-serif" font-size="30" font-weight="800" fill="#fff" letter-spacing="-0.5">Gustavo<tspan fill="#bfdbfe">Modas</tspan></text>
</svg>
