<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 306 56" width="306" height="56" role="img" aria-label="Gustavo Modas">
  <style>
    .fundo{transform-origin:28px 28px;animation:pop .5s cubic-bezier(.3,1.5,.5,1) both}
    .cabide{transform-origin:28px 12px;animation:balanco 1.6s .45s ease-out both,balanco-loop 7s 4s ease-out infinite}
    .brilho{animation:brilho 7s 1.2s ease-in-out infinite}
    .nome{animation:texto .6s .3s ease-out both}
    @keyframes pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
    @keyframes balanco{0%{transform:rotate(0)}15%{transform:rotate(16deg)}35%{transform:rotate(-11deg)}55%{transform:rotate(6deg)}75%{transform:rotate(-3deg)}100%{transform:rotate(0)}}
    @keyframes balanco-loop{0%{transform:rotate(0)}4%{transform:rotate(14deg)}10%{transform:rotate(-10deg)}16%{transform:rotate(5deg)}22%{transform:rotate(-2deg)}28%,100%{transform:rotate(0)}}
    @keyframes brilho{0%{transform:translateX(0)}18%,100%{transform:translateX(110px)}}
    @keyframes texto{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){.fundo,.cabide,.brilho,.nome{animation:none}}
  </style>
  <defs><clipPath id="clip"><rect width="56" height="56" rx="14"/></clipPath></defs>
  <rect class="fundo" width="56" height="56" rx="14" fill="#2563eb"/>
  <g clip-path="url(#clip)"><g transform="rotate(20 28 28)"><rect class="brilho" x="-30" y="-20" width="14" height="100" fill="#fff" opacity=".4"/></g></g>
  <g class="cabide" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M28 23v-3.5a4.5 4.5 0 1 0-4.5-4.5"/>
    <path d="M28 23 45 34.5a2 2 0 0 1-1.1 3.7H12.1A2 2 0 0 1 11 34.5L28 23"/>
  </g>
  <text class="nome" x="70" y="37" textLength="228" lengthAdjust="spacingAndGlyphs" font-family="Segoe UI, system-ui, -apple-system, Roboto, sans-serif" font-size="30" font-weight="800" fill="#0f1b33" letter-spacing="-0.5">Gustavo<tspan fill="#2563eb">Modas</tspan></text>
</svg>
